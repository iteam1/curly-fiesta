site_name: Curly Fiesta
site_url: http://localhost:8000
site_description: Exploring modern Python packaging with pyproject.toml

theme:
  name: material

plugins:
  - search:
      prebuild_index: true
      lang:
        - en
  - awesome-pages
  - kroki
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Docs:
          - "**"

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

markdown_extensions:
  # Code blocks with syntax highlighting
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
